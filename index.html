<style>
/* Layout: plein écran WebGL, HUD fin en haut et en bas, panneaux en surimpression */
:root{
  --void:#050608;      /* fond de la pièce */
  --phos:#ffb547;      /* phosphore ambre */
  --phos-dim:#9a6a26;  /* ambre éteint */
  --ink:#140c02;       /* texte sur barre ambre */
  --panel:#0d0a06ee;   /* panneau texte */
  --line:#3a2810;      /* filets */
  --ink:#140c02;       /* texte sur ambre */
  --f-screen:"VT323","Courier New",monospace;
  --f-ui:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
  color-scheme:dark;
}
html,body{height:100%;margin:0;background:var(--void);color:var(--phos);overflow:hidden}
body{font-family:var(--f-ui)}
#gl{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none;outline:none}
.hud{position:fixed;left:0;right:0;display:flex;align-items:center;gap:12px;padding-inline:16px;
  font-size:11px;letter-spacing:.14em;text-transform:uppercase;color:var(--phos-dim);pointer-events:none;z-index:5}
.hud.top{top:0;padding-top:calc(12px + env(safe-area-inset-top,0px))}
.hud.bottom{bottom:0;padding-bottom:calc(14px + env(safe-area-inset-bottom,0px));justify-content:center;text-align:center}
.hud .sp{flex:1}
.hud button,#backBtn{pointer-events:auto;font:inherit;letter-spacing:inherit;text-transform:uppercase;color:var(--phos);
  background:transparent;border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.hud button:hover,#backBtn:hover{border-color:var(--phos-dim)}
.hud button:focus-visible,#backBtn:focus-visible,#power:focus-visible,#closeTxt:focus-visible{outline:2px solid var(--phos);outline-offset:2px}
#chan{color:var(--phos)}
#chan::before{content:"";display:inline-block;width:7px;height:7px;border-radius:50%;background:var(--phos);margin-right:8px;vertical-align:1px;animation:blink 1.4s steps(2) infinite}
#backBtn{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(44px + env(safe-area-inset-bottom,0px));z-index:6;
  font-family:var(--f-ui);font-size:12px;letter-spacing:.14em;background:#0d0a06cc;padding:10px 16px}
@keyframes blink{50%{opacity:.15}}

#boot{position:fixed;inset:0;display:grid;place-items:center;z-index:10;cursor:pointer;
  background:radial-gradient(ellipse at center,#05060899 0%,#050608f2 70%);transition:opacity .8s ease}
#boot.off{opacity:0;pointer-events:none}
.boot-in{text-align:center;padding-inline:16px;max-width:36rem}
.boot-in .k{font-size:11px;letter-spacing:.3em;color:var(--phos-dim);margin:0 0 10px}
.boot-in h1{font-family:var(--f-screen);font-weight:400;font-size:clamp(48px,11vw,104px);line-height:.9;margin:0;color:var(--phos);
  text-shadow:0 0 18px #ffb54766,0 0 2px #ffb547;letter-spacing:.04em;text-wrap:balance}
.boot-in .r{font-size:12px;letter-spacing:.16em;text-transform:uppercase;color:var(--phos-dim);margin:14px 0 30px}
#power{font-family:var(--f-screen);font-size:30px;color:var(--phos);background:transparent;border:0;cursor:pointer;letter-spacing:.08em;animation:blink 1.1s steps(2) infinite}
.boot-in .s{font-size:10px;letter-spacing:.2em;color:var(--phos-dim);margin-top:22px;text-transform:uppercase}

#textcv{position:fixed;inset:0;z-index:20;background:#050608e6;overflow:auto;padding-inline:16px;padding-block:calc(20px + env(safe-area-inset-top,0px)) 40px}
.tc-in{max-width:44rem;margin:0 auto;background:var(--panel);border:1px solid var(--line);padding:24px clamp(16px,4vw,36px) 32px}
.tc-in header{display:flex;align-items:baseline;gap:12px;flex-wrap:wrap;border-bottom:1px solid var(--line);padding-bottom:14px;margin-bottom:8px}
.tc-in h2{font-family:var(--f-screen);font-weight:400;font-size:44px;margin:0;flex:1;line-height:1}
.tc-in header p{width:100%;margin:0;font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--phos-dim)}
#closeTxt{font:inherit;font-size:11px;letter-spacing:.14em;color:var(--phos);background:transparent;border:1px solid var(--line);padding:6px 10px;cursor:pointer}
.tc-sec h3{font-family:var(--f-screen);font-weight:400;font-size:30px;letter-spacing:.06em;margin:26px 0 6px;color:var(--phos)}
.tc-sec h4{font-size:13px;letter-spacing:.08em;margin:16px 0 2px;color:#f6d39b}
.tc-sec p,.tc-sec li,.tc-sec dd{font-size:13px;line-height:1.65;color:#e9c993;margin:4px 0}
.tc-sec .sub{color:var(--phos-dim);font-size:12px;margin:0 0 4px}
.tc-sec ul{margin:6px 0;padding-left:18px}
.tc-sec .tags{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.tc-sec .tags span{border:1px solid var(--line);padding:3px 8px;font-size:12px;color:#e9c993}
.tc-sec dl{display:grid;grid-template-columns:7rem 1fr;gap:4px 12px;margin:6px 0}
.tc-sec dt{font-size:11px;letter-spacing:.12em;color:var(--phos-dim);padding-top:3px}
.tc-sec dd{margin:0;min-width:0;overflow-wrap:anywhere}
.tc-sec a{color:var(--phos);text-underline-offset:3px}
.hud .grp{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
@media (max-width:560px){.hud.top{align-items:flex-start}.hud .grp button{padding:5px 7px;font-size:10px}#chan{max-width:9rem}}

#loader{position:fixed;inset:0;z-index:30;display:grid;place-items:center;background:var(--void);transition:opacity .6s ease;padding-inline:16px}
#loader.off{opacity:0;pointer-events:none}
.ld-in{display:grid;gap:14px;justify-items:center;width:min(520px,100%)}
.ld-tv{position:relative;width:100%;aspect-ratio:4/3;max-width:100%;border-radius:22px/18px;overflow:hidden;background:#000;
  box-shadow:0 0 0 10px #16130f,0 0 0 12px #2a241b,0 0 60px #ffb54722}
.ld-tv canvas{width:100%;height:100%;display:block;filter:saturate(.85) contrast(1.05)}
.ld-tv::after{content:"";position:absolute;inset:0;pointer-events:none;
  background:repeating-linear-gradient(0deg,rgba(0,0,0,.28) 0 1px,transparent 1px 3px),radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
#loadTxt{font-size:11px;letter-spacing:.24em;color:var(--phos-dim);margin:0;font-variant-numeric:tabular-nums}

#links{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(44px + env(safe-area-inset-bottom,0px));z-index:6;display:flex;gap:8px;flex-wrap:wrap;justify-content:center;max-width:calc(100% - 32px)}
#links a{font-family:var(--f-ui);font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--phos);padding:9px 14px;text-decoration:none;border:1px solid var(--phos)}
#links a:hover{background:transparent;color:var(--phos)}
#links a:focus-visible{outline:2px solid var(--phos);outline-offset:3px}
body.has-back #links{bottom:calc(92px + env(safe-area-inset-bottom,0px))}
#termInput{position:fixed;left:0;bottom:0;width:1px;height:1px;opacity:0;border:0;padding:0;font-size:16px;z-index:1}
@media (prefers-reduced-motion:reduce){#chan::before,#power{animation:none}#boot,#loader{transition:none}}
</style>

// mire de réglage originale : barres, grille, cercle, rampe de gris
function drawMire(ctx, w, h, t, o = {}){
  ctx.save();
  ctx.fillStyle = '#121212'; ctx.fillRect(0, 0, w, h);
  const bars = ['#c0c0c0','#c0c000','#00c0c0','#00c000','#c000c0','#c00000','#0000c0'];
  const bh = h*.52, bw = w/bars.length;
  bars.forEach((c,i)=>{ ctx.fillStyle = c; ctx.fillRect(Math.floor(i*bw), 0, Math.ceil(bw), bh); });
  const rev = ['#0000c0','#121212','#c000c0','#121212','#00c0c0','#121212','#c0c0c0'];
  rev.forEach((c,i)=>{ ctx.fillStyle = c; ctx.fillRect(Math.floor(i*bw), bh, Math.ceil(bw), h*.07); });
  for (let i=0;i<8;i++){ const v = Math.round(i*255/7); ctx.fillStyle = `rgb(${v},${v},${v})`; ctx.fillRect(i*w/8, h*.82, Math.ceil(w/8), h*.18); }
  // grille et cercle
  ctx.strokeStyle = 'rgba(255,255,255,.18)'; ctx.lineWidth = Math.max(1, w/512);
  for (let x=w/16; x<w; x+=w/16){ ctx.beginPath(); ctx.moveTo(x, 0); ctx.lineTo(x, h*.82); ctx.stroke(); }
  for (let y=h/12; y<h*.82; y+=h/12){ ctx.beginPath(); ctx.moveTo(0, y); ctx.lineTo(w, y); ctx.stroke(); }
  ctx.strokeStyle = 'rgba(255,255,255,.85)'; ctx.lineWidth = Math.max(2, w/300);
  ctx.beginPath(); ctx.arc(w/2, h*.43, h*.36, 0, Math.PI*2); ctx.stroke();
  ctx.beginPath(); ctx.moveTo(w/2 - h*.36, h*.43); ctx.lineTo(w/2 + h*.36, h*.43); ctx.moveTo(w/2, h*.07); ctx.lineTo(w/2, h*.79); ctx.stroke();
  // cartouche central
  const cw = w*.52, chh = h*.2, cx = w/2 - cw/2, cy = h*.43 - chh/2;
  ctx.fillStyle = '#0b0b0b'; ctx.fillRect(cx, cy, cw, chh);
  ctx.strokeStyle = '#ffb547'; ctx.lineWidth = Math.max(2, w/340); ctx.strokeRect(cx, cy, cw, chh);
  ctx.fillStyle = '#ffb547'; ctx.textAlign = 'center'; ctx.textBaseline = 'middle';
  ctx.font = `${Math.round(h*.085)}px VT323, "Courier New", monospace`;
  ctx.fillText(o.title || 'DS·VISION', w/2, cy + chh*.38);
  ctx.font = `${Math.round(h*.045)}px VT323, "Courier New", monospace`; ctx.fillStyle = '#e9c993';
  ctx.fillText(o.sub || '', w/2, cy + chh*.76);
  // barre de progression ou invitation
  if (o.progress != null){
    const pw = w*.5, ph = h*.035, px = w/2 - pw/2, py = h*.735;
    ctx.fillStyle = '#0b0b0b'; ctx.fillRect(px-4, py-4, pw+8, ph+8);
    ctx.fillStyle = '#ffb547'; ctx.fillRect(px, py, pw*Math.min(1, o.progress), ph);
  }
  if (o.footer){
    ctx.fillStyle = '#0b0b0b'; ctx.fillRect(w*.2, h*.86, w*.6, h*.09);
    ctx.fillStyle = Math.floor(t*2) % 2 ? '#ffb547' : '#9a6a26';
    ctx.font = `${Math.round(h*.05)}px VT323, "Courier New", monospace`; ctx.fillText(o.footer, w/2, h*.905);
  }
  // balayage lumineux
  const sy = ((t*.35) % 1) * h;
  const g = ctx.createLinearGradient(0, sy-40, 0, sy+40); g.addColorStop(0,'rgba(255,255,255,0)'); g.addColorStop(.5,'rgba(255,255,255,.07)'); g.addColorStop(1,'rgba(255,255,255,0)');
  ctx.fillStyle = g; ctx.fillRect(0, sy-40, w, 80);
  ctx.restore();
}

function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function renderTextCV(){
  let html = '';
  for (const s of CV.sections){
    html += `<div class="tc-sec"><h3>${esc(s.title)}</h3>`;
    if (s.projects){
      CV.projects.forEach((p, i)=>{
        const meta = PROJECT_META[i];
        html += `<h4>${esc(p.title)}</h4><p class="sub">${esc(p.sub)} · ${esc(p.status)}</p><p>${esc(p.desc)}</p>`;
        if (p.bullets.length) html += '<ul>' + p.bullets.map(b=>`<li>${esc(b)}</li>`).join('') + '</ul>';
        html += `<div class="tags">${p.stack.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`;
        if (meta.link && p.linkLabel) html += `<p><a href="${esc(meta.link)}" target="_blank" rel="noopener">${esc(p.linkLabel)}</a></p>`;
      });
    }
    let inList = false, inDl = false;
    const close = () => { if(inList){html+='</ul>';inList=false;} if(inDl){html+='</dl>';inDl=false;} };
    for (const b of s.blocks){
      if (b.li){ if(inDl){html+='</dl>';inDl=false;} if(!inList){html+='<ul>';inList=true;} html+=`<li>${esc(b.li)}</li>`; continue; }
      if (b.kv){ if(inList){html+='</ul>';inList=false;} if(!inDl){html+='<dl>';inDl=true;} html+=`<dt>${esc(b.kv[0])}</dt><dd>${esc(b.kv[1])}</dd>`; continue; }
      close();
      if (b.h) html += `<h4>${esc(b.h)}</h4>`;
      else if (b.sub) html += `<p class="sub">${esc(b.sub)}</p>`;
      else if (b.p) html += `<p>${esc(b.p)}</p>`;
      else if (b.tags) html += `<div class="tags">${b.tags.map(t=>`<span>${esc(t)}</span>`).join('')}</div>`;
    }
    close();
    if (s.links) html += s.links.map(l=>`<p><a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a></p>`).join('');
    html += '</div>';
  }
  $('tcBody').innerHTML = html;
}

function canvasTex(w, h, draw, rep){
  const c = document.createElement('canvas'); c.width = w; c.height = h;
  draw(c.getContext('2d'), w, h);
  const t = new THREE.CanvasTexture(c);
  t.colorSpace = THREE.SRGBColorSpace;
  if (rep){ t.wrapS = t.wrapT = THREE.RepeatWrapping; t.repeat.set(rep[0], rep[1]); }
  t.anisotropy = 4;
  return t;
}
function speckle(ctx, w, h, n, a){
  for (let i=0;i<n;i++){
    const v = Math.random()*255|0;
    ctx.fillStyle = `rgba(${v},${v},${v},${Math.random()*a})`;
    ctx.fillRect(Math.random()*w, Math.random()*h, 1+Math.random()*2, 1+Math.random()*2);
  }
}
const floorTex = canvasTex(512, 512, (ctx,w,h)=>{
  ctx.fillStyle = '#26282a'; ctx.fillRect(0,0,w,h);
  speckle(ctx,w,h,9000,.18);
  for (let i=0;i<14;i++){ const g=ctx.createRadialGradient(Math.random()*w,Math.random()*h,0,Math.random()*w,Math.random()*h,120);
    g.addColorStop(0,'rgba(0,0,0,.25)'); g.addColorStop(1,'rgba(0,0,0,0)'); ctx.fillStyle=g; ctx.fillRect(0,0,w,h); }
  ctx.strokeStyle = 'rgba(0,0,0,.55)'; ctx.lineWidth = 3;
  ctx.strokeRect(0,0,w,h); ctx.beginPath(); ctx.moveTo(w/2,0); ctx.lineTo(w/2,h); ctx.moveTo(0,h/2); ctx.lineTo(w,h/2); ctx.stroke();
}, [5,5]);
const wallTex = canvasTex(512, 512, (ctx,w,h)=>{
  const g = ctx.createLinearGradient(0,0,0,h); g.addColorStop(0,'#1d2226'); g.addColorStop(1,'#14181b');
  ctx.fillStyle = g; ctx.fillRect(0,0,w,h);
  speckle(ctx,w,h,6000,.12);
  ctx.fillStyle = 'rgba(0,0,0,.35)'; for (let x=0;x<w;x+=128) ctx.fillRect(x,0,3,h);
  ctx.fillStyle = 'rgba(0,0,0,.25)'; ctx.fillRect(0,h*.62,w,4);
  for (let i=0;i<10;i++){ ctx.fillStyle=`rgba(40,30,15,${Math.random()*.12})`; ctx.fillRect(Math.random()*w, h*.62, 4+Math.random()*10, Math.random()*h*.38); }
}, [4,1.5]);

/* ---------- shader écran CRT ---------- */
const crtVert = `varying vec2 vUv; void main(){ vUv=uv; gl_Position=projectionMatrix*modelViewMatrix*vec4(position,1.0); }`;
const crtFrag = `
uniform sampler2D uTex; uniform float uTime,uStatic,uPower,uBright,uSeed,uTrack;
varying vec2 vUv;
float hash(vec2 p){ p=fract(p*vec2(123.34,456.21)); p+=dot(p,p+45.32); return fract(p.x*p.y); }
void main(){
  vec2 uv=vUv;
  float p=clamp(uPower,0.0,1.0);
  float sx=smoothstep(0.0,0.35,p);
  float sy=mix(0.006,1.0,smoothstep(0.3,1.0,p));
  vec2 q=(uv-0.5)/vec2(max(sx,0.001),sy)+0.5;
  vec2 c=q*2.0-1.0; c*=1.0+vec2(c.y*c.y,c.x*c.x)*0.045; vec2 t=c*0.5+0.5;
  vec2 rq=abs(t-0.5)-(0.5-0.06); float sd=length(max(rq,0.0))+min(max(rq.x,rq.y),0.0)-0.06;
  float inside=1.0-smoothstep(-0.006,0.0,sd);
  float jit=(hash(vec2(floor(t.y*240.0),floor(uTime*24.0)+uSeed))-0.5)*0.004*(0.25+uStatic*2.0);
  float band=exp(-pow((fract(t.y*0.8+uTime*0.45)-0.5)*7.0,2.0))*uTrack;
  jit+=(hash(vec2(floor(t.y*90.0),floor(uTime*30.0)))-0.5)*0.05*band+sin(t.y*40.0+uTime*20.0)*0.004*uTrack;
  vec2 tj=t+vec2(jit,0.0);
  float ab=0.0016;
  vec3 col=vec3(texture2D(uTex,tj+vec2(ab,0.0)).r, texture2D(uTex,tj).g, texture2D(uTex,tj-vec2(ab,0.0)).b);
  float n=hash(floor(t*vec2(260.0,195.0))+floor(uTime*30.0)*vec2(1.7,3.1)+uSeed);
  col=mix(col, vec3(n)*vec3(1.0,0.86,0.66)*0.5, uStatic);
  col=mix(col, vec3(n)*0.9, band*0.55);
  col*=0.78+0.22*sin(t.y*3.14159*384.0);
  float sub=fract(t.x*1024.0/3.0);
  vec3 mask=vec3(step(sub,0.333),step(0.333,sub)*step(sub,0.666),step(0.666,sub));
  col*=mix(vec3(1.0),mask*1.9+0.25,0.16);
  col+=vec3(1.0,0.62,0.22)*0.05*uBright*(1.0-smoothstep(-0.12,0.0,sd))*smoothstep(-0.12,-0.02,sd)*step(0.5,uPower);
  float roll=exp(-pow((fract(t.y-uTime*0.11)-0.5)*9.0,2.0));
  col*=1.0+roll*0.1;
  vec2 v=t*(1.0-t); col*=pow(clamp(v.x*v.y*16.0,0.0,1.0),0.25);
  col+=(n-0.5)*0.035;
  col*=0.96+0.04*sin(uTime*55.0+uSeed);
  col*=uBright*inside;
  float line=(1.0-smoothstep(0.0,0.02,abs(uv.y-0.5)))*(1.0-smoothstep(0.3,0.9,p))*step(abs(uv.x-0.5),sx*0.5);
  col+=vec3(1.0,0.85,0.6)*line*3.0;
  col*=step(0.0001,p);
  gl_FragColor=vec4(col,1.0);
}`;


/* =========================================================
   ÉCRANS (canvas 2D, 1024×768, filtrés ensuite par le shader CRT)
   ========================================================= */
const CW = 1024, CH = 768;
const C = {fg:'#ffb547', dim:'#9a6a26', faint:'#3a2810', ink:'#140c02', soft:'#f2cf94'};
const BK = 0.045; // courbure, identique au shader
const SAFE = 0.88; // le contenu est dessiné à 88 % pour rester loin des bords arrondis
function safeBegin(ctx){ ctx.save(); ctx.translate(CW/2,CH/2); ctx.scale(SAFE,SAFE); ctx.translate(-CW/2,-CH/2); }
function barrel(u, v){ let cx=u*2-1, cy=v*2-1; const kx=1+cy*cy*BK, ky=1+cx*cx*BK; cx*=kx; cy*=ky; return [cx*.5+.5, cy*.5+.5]; }
const pad2 = n => String(n).padStart(2, '0');

function paintBase(ctx){
  const g = ctx.createRadialGradient(CW/2,CH/2,80,CW/2,CH/2,720);
  g.addColorStop(0,'#1c1207'); g.addColorStop(1,'#060402');
  ctx.fillStyle = g; ctx.fillRect(0,0,CW,CH);
  ctx.fillStyle = 'rgba(255,181,71,0.045)';
  for (let x=64;x<CW;x+=64) ctx.fillRect(x,0,1,CH);
  for (let y=64;y<CH;y+=64) ctx.fillRect(0,y,CW,1);
}
function wrap(ctx, text, maxW){
  const words = String(text).split(' '), lines = []; let line = '';
  for (const w of words){ const test = line ? line+' '+w : w;
    if (ctx.measureText(test).width > maxW && line){ lines.push(line); line = w; } else line = test; }
  if (line) lines.push(line); return lines;
}
function fitText(ctx, text, maxW){
  if (ctx.measureText(text).width <= maxW) return text;
  let s = text; while (s.length > 1 && ctx.measureText(s + '…').width > maxW) s = s.slice(0, -1);
  return s + '…';
}

/* ---------- mise en page des blocs de texte ---------- */
const AREA = {x:100, top:228, bottom:700, w:800};
function layoutBlocks(ctx, blocks, W, y0 = 0){
  const ops = []; let y = y0, first = y0 === 0;
  for (const b of blocks){
    if (b.h){ if(!first) y += 22; ctx.font='44px VT323'; for (const l of wrap(ctx,b.h,W)){ ops.push({k:'h',t:l,y,f:'44px VT323'}); y += 46; } }
    else if (b.sub){ ctx.font='30px VT323'; for (const l of wrap(ctx,b.sub,W)){ ops.push({k:'sub',t:l,y,f:'30px VT323'}); y += 34; } }
    else if (b.p){ ctx.font='34px VT323'; for (const l of wrap(ctx,b.p,W)){ ops.push({k:'p',t:l,y,f:'34px VT323'}); y += 36; } y += 10; }
    else if (b.li){ ctx.font='32px VT323'; const ls = wrap(ctx,b.li,W-34);
      ls.forEach((l,i)=>{ ops.push({k:'li',t:l,y,f:'32px VT323',bullet:i===0}); y += 33; }); y += 6; }
    else if (b.tags){ ctx.font='30px VT323'; let x = 0; y += 4;
      for (const t of b.tags){ const tw = ctx.measureText(t).width + 28;
        if (x + tw > W){ x = 0; y += 54; }
        ops.push({k:'tag',t,x,y,w:tw,f:'30px VT323'}); x += tw + 12; }
      y += 62; }
    else if (b.kv){ ctx.font='34px VT323'; const kw = Math.min(230, W*.36); const ls = wrap(ctx,b.kv[1],W-kw);
      ops.push({k:'key',t:b.kv[0],y,f:'28px VT323'});
      ls.forEach(l=>{ ops.push({k:'val',t:l,y,f:'34px VT323',kx:kw}); y += 38; }); y += 10; }
    else if (b.warn){ ctx.font='28px VT323'; for (const l of wrap(ctx,b.warn,W)){ ops.push({k:'sub',t:l,y,f:'28px VT323'}); y += 32; } }
    else if (b.gap){ y += 26; }
    first = false;
  }
  return {ops, height:y};
}
function layoutSection(ctx, sec){
  const W = sec.photo ? 520 : AREA.w;
  return layoutBlocks(ctx, sec.blocks, W);
}
function drawOps(ctx, ops, x0, oy, extra){
  for (const o of ops){
    const y = oy + o.y; if (y < AREA.top-80 || y > AREA.bottom+10) continue;
    ctx.font = o.f || '30px VT323';
    if (o.k==='h'){ ctx.fillStyle = C.fg; ctx.fillText(o.t, x0, y+36); }
    else if (o.k==='sub'){ ctx.fillStyle = C.dim; ctx.fillText(o.t, x0, y+26); }
    else if (o.k==='p'){ ctx.fillStyle = C.soft; ctx.fillText(o.t, x0, y+28); }
    else if (o.k==='li'){ ctx.fillStyle = C.fg; if (o.bullet) ctx.fillText('›', x0, y+26); ctx.fillStyle = C.soft; ctx.fillText(o.t, x0+34, y+26); }
    else if (o.k==='tag'){ ctx.strokeStyle = C.dim; ctx.lineWidth = 2; ctx.strokeRect(x0+o.x, y, o.w, 44); ctx.fillStyle = C.soft; ctx.fillText(o.t, x0+o.x+14, y+32); }
    else if (o.k==='key'){ ctx.fillStyle = C.dim; ctx.fillText(o.t, x0, y+28); }
    else if (o.k==='val'){ ctx.fillStyle = C.soft; ctx.fillText(o.t, x0+(o.kx||230), y+28); }
    else if (extra) extra(o, y);
  }
}
function drawScrollbar(ctx, scroll, height, coarseHint){
  const viewH = AREA.bottom - AREA.top, max = Math.max(0, height - viewH);
  if (max <= 0) return;
  ctx.fillStyle = C.faint; ctx.fillRect(932, AREA.top, 4, viewH);
  const hh = Math.max(40, viewH * viewH / height), yy = AREA.top + (viewH - hh) * (scroll / max);
  ctx.fillStyle = C.fg; ctx.fillRect(930, yy, 8, hh);
  if (scroll < max - 4){ ctx.fillStyle = C.dim; ctx.font = '26px VT323'; ctx.fillText(coarseHint ? UI.scrollTouch : UI.scroll, 100, 740); }
}
function drawHeader(ctx, tv, chLabel, title, backLabel, active, t, backAct = 'back'){
  ctx.fillStyle = C.dim; ctx.font = '30px VT323'; ctx.fillText(chLabel + '  //  ' + CV.name, 100, 108);

  ctx.strokeStyle = hov ? C.fg : C.dim; ctx.lineWidth = 3; ctx.strokeRect(bx, by, bw, bh);
  if (hov){ ctx.fillStyle = C.fg; ctx.fillRect(bx, by, bw, bh); }
  ctx.fillStyle = hov ? C.ink : C.fg; ctx.fillText(backLabel, bx+20, by+33);
  tv.hits.push({x:bx, y:by, w:bw, h:bh, act:backAct});

/* ---------- images (photo, captures) ---------- */
const imgCache = new Map();
let onImageReady = () => {};
function getImg(url){
  if (!url) return null;
  let e = imgCache.get(url);
  if (!e){ e = {img:new Image(), ok:false}; e.img.onload = () => { e.ok = true; onImageReady(); }; e.img.src = url; imgCache.set(url, e); }
  return e.ok ? e.img : null;
}
function drawCover(ctx, img, x, y, w, h){
  const r = Math.max(w/img.width, h/img.height), iw = img.width*r, ih = img.height*r;
  ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
  ctx.filter = 'grayscale(1) sepia(1) saturate(2.2) hue-rotate(-12deg) brightness(.95) contrast(1.1)';
  ctx.drawImage(img, x + (w-iw)/2, y + (h-ih)/2, iw, ih); ctx.filter = 'none';
  ctx.restore();
}
function drawPhotoFrame(ctx, x, y, w, h){
  const img = getImg(MEDIA.photo);
  ctx.fillStyle = '#0a0703'; ctx.fillRect(x, y, w, h);
  if (img) drawCover(ctx, img, x, y, w, h);
  else {
    ctx.save(); ctx.beginPath(); ctx.rect(x, y, w, h); ctx.clip();
    ctx.strokeStyle = C.faint; ctx.lineWidth = 2;
    for (let i=-h; i<w; i+=22){ ctx.beginPath(); ctx.moveTo(x+i, y+h); ctx.lineTo(x+i+h, y); ctx.stroke(); }
    ctx.restore();
    ctx.fillStyle = '#0a0703'; ctx.fillRect(x+18, y+h*.18, w-36, h*.56);
    ctx.fillStyle = C.fg; ctx.font = '150px VT323'; ctx.textAlign = 'center'; ctx.fillText('DS', x+w/2, y+h*.56);
    ctx.font = '26px VT323'; ctx.fillStyle = C.dim; ctx.fillText(UI.photoPlaceholder, x+w/2, y+h*.68); ctx.textAlign = 'left';
  }
  ctx.strokeStyle = C.dim; ctx.lineWidth = 3; ctx.strokeRect(x, y, w, h);
  ctx.fillStyle = C.fg; for (const [cx,cy] of [[x,y],[x+w,y],[x,y+h],[x+w,y+h]]) ctx.fillRect(cx-7, cy-7, 14, 14);
}

const noiseC = document.createElement('canvas'); noiseC.width = 256; noiseC.height = 192;

function layoutProject(ctx, i){
  const p = CV.projects[i], meta = PROJECT_META[i], ops = [];
  const SX = 448, SW = 376;                     // colonne de droite, à côté de l'aperçu
  ops.push({k:'shot', i, y:0, h:262});
  ops.push({k:'lbl', t:UI.stack, x:SX, y:0});
  ctx.font = '30px VT323';
  let x = 0, y = 40;
  for (const tg of p.stack){ const tw = ctx.measureText(tg).width + 28;
    if (x + tw > SW && x > 0){ x = 0; y += 54; }
    ops.push({k:'tag', t:tg, x:SX + x, y, w:tw, f:'30px VT323'}); x += tw + 12; }
  y += 66;
  ops.push({k:'lbl', t:UI.status, x:SX, y}); y += 36;
  ops.push({k:'stat', t:p.status, x:SX, y, color:meta.color}); y += 44;
  const top = Math.max(262, y) + 30;
  const blocks = [{sub:p.sub}, {p:p.desc}, ...p.bullets.map(b=>({li:b}))];
  if (!meta.link || !p.linkLabel) blocks.push({gap:1}, {warn:UI.internal});
  const L = layoutBlocks(ctx, blocks, AREA.w, top);
  return {ops: ops.concat(L.ops), height: L.height + 10};
}

  ctx.fillStyle = C.dim; ctx.fillRect(x+26, y+9, 8, 8); ctx.fillRect(x+42, y+9, 8, 8);
  const bx = x + 14, by = y + 40, bw = w - 28, bh = h - 54;
  if (kind === 'docs'){
    ctx.fillStyle = dim; ctx.fillRect(bx, by, 90, bh);
    for (let i=0;i<6;i++){ ctx.fillStyle = i === 1 ? acc : C.dim; ctx.fillRect(bx+10, by+12+i*26, 60, 10); }

  } else if (kind === 'leaderboard'){
    for (let i=0;i<7;i++){ const ry = by + i*29; ctx.fillStyle = i%2 ? 'rgba(255,181,71,.05)' : 'rgba(255,181,71,.1)'; ctx.fillRect(bx, ry, bw, 26);
      ctx.fillStyle = i < 3 ? acc : C.dim; ctx.font = '22px VT323'; ctx.fillText('#' + (i+1), bx+8, ry+20);
      ctx.fillStyle = fg; ctx.fillRect(bx+52, ry+9, 90 - i*6, 8);
      ctx.fillStyle = acc; ctx.fillRect(bx+bw-150, ry+8, 140 - i*16, 10); }
  } else if (kind === 'stats'){
    for (let i=0;i<3;i++){ const cx = bx + i*(bw/3); ctx.strokeStyle = C.dim; ctx.lineWidth = 2; ctx.strokeRect(cx+4, by, bw/3-8, 70);
      ctx.fillStyle = i === 0 ? acc : fg; ctx.font = '40px VT323'; ctx.fillText(['2.41','18%','312'][i], cx+16, by+50); }

   CANAL 12 : terminal caché
   ========================================================= */
const G = {fg:'#8dffa4', dim:'#3f8a50', bg0:'#06140a', bg1:'#020703'};
const term = {lines:[], input:'', hist:[], hi:-1, booted:false};
function termPrint(x){ for (const l of [].concat(x)) term.lines.push(String(l)); if (term.lines.length > 400) term.lines.splice(0, term.lines.length - 400); }
function termBoot(){ if (term.booted) return; term.booted = true; termPrint(CV.term.welcome); }

function termRun(raw){
  const line = raw.trim(); const T = CV.term;
  termPrint('> ' + line);
  if (!line) return;
  term.hist.push(line); term.hi = -1;
  const [c0, ...args] = line.split(/\s+/); const c = c0.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '');
  const arg = args.join(' ');
  const is = (...names) => names.includes(c);
  if (is('aide','help','?','h')) termPrint(T.help);
  else if (is('whoami','qui')) termPrint(T.whoami);
  else if (is('projets','projects')){
    termPrint(T.projectsIntro);
    CV.projects.forEach((p,i)=>termPrint(`  ${pad2(i+1)}  ${p.title}  ·  ${p.status}`));
    termPrint(T.projectsOutro);
  }
  else if (is('projet','project','play','lire')){
    const n = parseInt(arg, 10);
    if (!(n >= 1 && n <= CV.projects.length)) termPrint(T.projectBad);
    else { termPrint(T.projectGo); after(.5, ()=>playProject(n-1, true)); }
  }
  else if (is('competences','skills','stack')) termPrint(T.skills);
  else if (is('formation','education','etudes')) termPrint(T.education);
  else if (is('contact','mail','email')) termPrint(T.contact);
  else if (is('noctura','esport')) termPrint(T.noctura);
  else if (is('ls','dir')) termPrint(T.ls);
  else if (is('cat','type')){
    const a = arg.toLowerCase();
    if (a.includes('secret')) termPrint(T.secret);
    else if (a.includes('cv')) termPrint(T.cv);
    else if (a.includes('proj')) termRun('projets');
    else termPrint(`cat: ${arg || '?'}: ${LANG === 'fr' ? 'introuvable' : 'not found'}`);
  }
  else if (is('sudo','su','rm')) termPrint(T.sudo);
  else if (is('date','time')) termPrint(T.date());
  else if (is('echo')) termPrint(arg);
  else if (is('clear','cls','effacer')) term.lines = [];
  else if (is('lang','langue','language')){
    const want = arg.toLowerCase().startsWith('en') ? 'en' : arg.toLowerCase().startsWith('fr') ? 'fr' : (LANG === 'fr' ? 'en' : 'fr');
    setLang(want); termPrint(CV.term.langSet);
  }
  else if (is('exit','quit','quitter','sortir','menu','q')){ termPrint(T.exit); after(.4, ()=>tuneTo(2)); }
  else termPrint(T.unknown(c0));
}

function drawTerminal(tv, t){
  const ctx = tv.ctx;
  const g = ctx.createRadialGradient(CW/2, CH/2, 80, CW/2, CH/2, 720); g.addColorStop(0, G.bg0); g.addColorStop(1, G.bg1);
  ctx.fillStyle = g; ctx.fillRect(0, 0, CW, CH);
  safeBegin(ctx); ctx.textAlign = 'left'; ctx.textBaseline = 'alphabetic';
  tv.hits = [{x:0, y:0, w:CW, h:CH, act:'term'}];
  ctx.fillStyle = G.dim; ctx.font = '30px VT323'; ctx.fillText(UI.termTitle, 100, 108);
  ctx.textAlign = 'right'; ctx.fillText(LANG.toUpperCase() + ' · ' + new Date().toLocaleTimeString(LANG === 'fr' ? 'fr-FR' : 'en-GB', {hour:'2-digit', minute:'2-digit'}), 924, 108); ctx.textAlign = 'left';
  ctx.fillStyle = G.dim; ctx.fillRect(100, 124, 824, 2);
  ctx.font = '31px VT323';
  const rows = [];
  for (const l of term.lines){ if (l === '') { rows.push(''); continue; } for (const w of wrap(ctx, l, 820)) rows.push(w); }
  const caret = Math.floor(t*2.2)%2 ? '█' : ' ';
  const inputRows = wrap(ctx, '> ' + term.input + caret, 820);
  const maxRows = 16, out = rows.slice(-(maxRows - inputRows.length));
  let y = 168;
  for (const r of out){ ctx.fillStyle = r.startsWith('> ') ? G.dim : G.fg; ctx.fillText(r, 100, y); y += 33; }
  ctx.fillStyle = '#c9ffd2'; for (const r of inputRows){ ctx.fillText(r, 100, y); y += 33; }
  if (coarse && !term.input && document.activeElement !== termInput){ ctx.fillStyle = G.dim; ctx.font = '26px VT323'; ctx.fillText(LANG === 'fr' ? 'TOUCHEZ L’ÉCRAN POUR TAPER' : 'TAP THE SCREEN TO TYPE', 100, 728); }
  ctx.restore();
}

function makeRack(w, d, hgt){
  const g = new THREE.Group(), pole = new THREE.BoxGeometry(.035, hgt, .035);
  for (const sx of [-1,1]) for (const sz of [-1,1]){
    const m = new THREE.Mesh(pole, mats.metal); m.position.set(sx*(w/2-.02), hgt/2, sz*(d/2-.02)); g.add(m); }
  const shelfs = hgt > 1 ? [0.12, hgt*0.5, hgt-0.015] : [0.1, hgt-0.015];
  for (const y of shelfs){ const s = new THREE.Mesh(new THREE.BoxGeometry(w, .03, d), mats.metal); s.position.y = y; g.add(s); }
  const led = new THREE.Mesh(new THREE.SphereGeometry(.012,8,6), new THREE.MeshStandardMaterial({color:0x221100, emissive:0xffa030, emissiveIntensity:2}));
  led.position.set(w/2-.06, hgt-.05, d/2+.005); g.add(led); g.userData.led = led;
  return g;
}
// pieds compas façon mobilier des années 60
function makeLegs(w, d, hgt, mat){
  const g = new THREE.Group(), splay = .16;
  const len = hgt / Math.cos(splay);
  const geo = new THREE.CylinderGeometry(.02, .011, len, 12);
  for (const sx of [-1,1]) for (const sz of [-1,1]){
    const m = new THREE.Mesh(geo, mat);
    m.rotation.z = sx*splay; m.rotation.x = -sz*splay*.6;
    m.position.set(sx*(w/2 - .07) + sx*Math.tan(splay)*hgt*.5, hgt/2, sz*(d/2 - .08) + sz*Math.tan(splay*.6)*hgt*.5);
    const cap = new THREE.Mesh(new THREE.CylinderGeometry(.013,.013,.025,10), mats.chrome);
    cap.position.y = -len/2 + .012; m.add(cap);
    g.add(m);
  }
  const rail = new THREE.Mesh(new RoundedBoxGeometry(w - .06, .04, d - .08, 2, .015), mat); rail.position.y = hgt - .02; g.add(rail);
  return g;
}

function roundRect(w, h, r){
  const s = new THREE.Shape(), x = -w/2, y = -h/2;
  s.moveTo(x+r, y); s.lineTo(x+w-r, y); s.quadraticCurveTo(x+w, y, x+w, y+r);
  s.lineTo(x+w, y+h-r); s.quadraticCurveTo(x+w, y+h, x+w-r, y+h);
  s.lineTo(x+r, y+h); s.quadraticCurveTo(x, y+h, x, y+h-r);
  s.lineTo(x, y+r); s.quadraticCurveTo(x, y, x+r, y);
  return s;
}
function bezelFrame(ow, oh, iw, ih, ro, ri, depth, bevel, mat){
  const sh = roundRect(ow, oh, ro); sh.holes.push(roundRect(iw, ih, ri));
  const geo = new THREE.ExtrudeGeometry(sh, {depth, bevelEnabled:true, bevelThickness:bevel, bevelSize:bevel, bevelSegments:3, curveSegments:10});
  return new THREE.Mesh(geo, mat);
}
function curvedPlane(w, h, bulge){
  const geo = new THREE.PlaneGeometry(w, h, 32, 24), p = geo.attributes.position;
  for (let i=0;i<p.count;i++){ const nx = p.getX(i)/(w/2), ny = p.getY(i)/(h/2); p.setZ(i, bulge*(1-nx*nx)*(1-ny*ny)); }
  geo.computeVertexNormals(); return geo;
}
function dialFace(light){
  return canvasTex(256, 256, (ctx,w,h)=>{
    const c = w/2;
    ctx.fillStyle = light ? '#d9d2c2' : '#141416'; ctx.beginPath(); ctx.arc(c,c,c,0,Math.PI*2); ctx.fill();
    ctx.strokeStyle = light ? '#2a2620' : '#c9c3b6'; ctx.fillStyle = ctx.strokeStyle;
    ctx.textAlign = 'center'; ctx.textBaseline = 'middle'; ctx.font = 'bold 30px "IBM Plex Mono", monospace';
    for (let n=1;n<=12;n++){
      const a = -n*Math.PI/6; // chiffres dans le sens inverse : tourner à droite fait monter la chaîne
      ctx.lineWidth = 3; ctx.beginPath(); ctx.moveTo(c+Math.sin(a)*112, c-Math.cos(a)*112); ctx.lineTo(c+Math.sin(a)*124, c-Math.cos(a)*124); ctx.stroke();
      ctx.fillText(String(n), c+Math.sin(a)*86, c-Math.cos(a)*86);
    }
    const g = ctx.createRadialGradient(c-20,c-20,4,c,c,46); g.addColorStop(0,'#f4f1ea'); g.addColorStop(1,'#77736b');
    ctx.fillStyle = g; ctx.beginPath(); ctx.arc(c,c,44,0,Math.PI*2); ctx.fill();
    ctx.fillStyle = '#1a1a1a'; ctx.fillRect(c-5, c-44, 10, 40);
  });
}
function plateTex(text, dark){

function rod(a, b, r, mat){
  const dir = new V3().subVectors(b, a), len = dir.length();

// trajet d'une cassette : pile → devant → fente du magnétoscope → dedans
function tapePath(tp, toVCR){
  const s = media.slotLocal, td = media.tapeDepth;
  const out = tp.home.clone().add(new V3(0, .02, .3));
  const front = new V3(s.x, s.y, s.z + td/2 + .22), mouth = new V3(s.x, s.y, s.z + td/2 + .01), inside = new V3(s.x, s.y, s.z - td/2 - .015);
  const pts = [tp.home.clone(), out, front, mouth, inside];
  const durs = [.32, .5, .28, .34];
  return toVCR ? {pts, durs, rot:[tp.homeRot, 0, 0, 0, 0]} : {pts: pts.slice().reverse(), durs: durs.slice().reverse(), rot:[0, 0, 0, 0, tp.homeRot]};
}
function animateTape(tp, toVCR, done){
  const p = tapePath(tp, toVCR);
  tp.anim = {...p, seg:0, t:0, done};
  tp.inVCR = toVCR;
}
function updateTapes(dt){
  for (const tp of media.tapes){
    const a = tp.anim; if (!a) continue;
    a.t += dt / (a.durs[a.seg] * M);
    const k = Math.min(1, a.t), e = k < .5 ? 2*k*k : 1 - Math.pow(-2*k + 2, 2)/2;
    tp.group.position.lerpVectors(a.pts[a.seg], a.pts[a.seg + 1], e);
    tp.group.rotation.y = a.rot[a.seg] + (a.rot[a.seg + 1] - a.rot[a.seg]) * e;
    if (a.t >= 1){ a.seg++; a.t = 0; if (a.seg >= a.durs.length){ tp.anim = null; a.done && a.done(); } }
  }
  const wantOpen = media.tapes.some(tp => tp.anim && tp.anim.seg >= 2);
  media.flapT += ((wantOpen ? 1 : 0) - media.flapT) * Math.min(1, dt*12);
  media.flap.rotation.x = media.flapT * 1.25;
}
function drawVCRDisplay(t){

const V = THREE.Vector3;
function viewFor(tv, menu, close = false){
  tv.screen.updateWorldMatrix(true, false);
  const center = tv.screen.getWorldPosition(new V());
  const n = new V(0,0,1).transformDirection(tv.screen.matrixWorld);
  const r = new V(1,0,0).transformDirection(tv.screen.matrixWorld);
  const tan = Math.tan(THREE.MathUtils.degToRad(camera.fov/2)), asp = camera.aspect, s = tv.spec;
  const wide = asp > 1.15;
  if (!menu && !close && s.stand === 'media' && wide){
    // canal Projets : on cadre aussi le meuble, la pile de cassettes et le magnétoscope
    const m = tv.root.localToWorld(new V(-.5, .42, .2));
    const target = center.clone().lerp(m, .42);
    const dH = (1.5*1.08/2)/tan, dW = (2.15*1.08/2)/(tan*asp);
    return {pos: target.clone().addScaledVector(n, Math.max(dH, dW)).add(new V(0, .12, 0)), target};
  }
  const fh = menu && wide ? 2.25 : 1.36, fw = menu && wide ? 1.6 : 1.2;
  const sh = menu && wide ? s.w*.32 : 0;
  const cabHalf = s.w/2 + .12 + (s.knobs ? .26 : 0) + .1;
  const d = Math.max((s.h*fh/2)/tan, (s.w*fw/2)/(tan*asp), menu ? (cabHalf + sh)/(tan*asp) : 0);
  const target = center.clone(), pos = center.clone().addScaledVector(n, d);
  if (sh){ target.addScaledVector(r, sh); pos.addScaledVector(r, sh); pos.y += .05; }
  return {pos, target};
}

const sfx = {
  ctx:null, master:null, on:true, nbuf:null,
  init(){
    try{
      this.ctx = new (window.AudioContext||window.webkitAudioContext)();
      this.master = this.ctx.createGain(); this.master.gain.value = this.on ? .6 : 0; this.master.connect(this.ctx.destination);
      const len = this.ctx.sampleRate; this.nbuf = this.ctx.createBuffer(1, len, this.ctx.sampleRate);
      const d = this.nbuf.getChannelData(0); for (let i=0;i<len;i++) d[i] = Math.random()*2-1;
      const hum = this.ctx.createGain(); hum.gain.value = .014; hum.connect(this.master);
      for (const [f,v] of [[50,1],[100,.45],[150,.15]]){ const o = this.ctx.createOscillator(), g = this.ctx.createGain(); o.frequency.value = f; g.gain.value = v; o.connect(g).connect(hum); o.start(); }
      const rs = this.ctx.createBufferSource(); rs.buffer = this.nbuf; rs.loop = true;
      const lp = this.ctx.createBiquadFilter(); lp.type = 'lowpass'; lp.frequency.value = 420;
      const rg = this.ctx.createGain(); rg.gain.value = .02; rs.connect(lp).connect(rg).connect(this.master); rs.start();
    }catch(e){ this.ctx = null; }
  },
  beep(f, dur, type='square', vol=.04, delay=0){
    const c = this.ctx; if (!c) return; const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain(); o.type = type; o.frequency.value = f;
    g.gain.setValueAtTime(0, t0); g.gain.linearRampToValueAtTime(vol, t0+.005); g.gain.exponentialRampToValueAtTime(.0001, t0+dur);
    o.connect(g).connect(this.master); o.start(t0); o.stop(t0+dur+.03);
  },
  noise(dur, f0, f1, vol, q=1){
    const c = this.ctx; if (!c) return; const t0 = c.currentTime;
    const s = c.createBufferSource(); s.buffer = this.nbuf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.Q.value = q;
    bp.frequency.setValueAtTime(f0, t0); bp.frequency.exponentialRampToValueAtTime(f1, t0+dur);

    s.connect(bp).connect(g).connect(this.master); s.start(t0); s.stop(t0+dur+.05);
  },
  tick(){ this.beep(1500,.035,'square',.02); },
  select(){ this.beep(660,.07,'square',.035); this.beep(990,.1,'square',.035,.06); },
  back(){ this.beep(560,.07,'square',.03); this.beep(370,.1,'square',.03,.06); },
  whoosh(){ this.noise(.9*M, 280, 2400, .07, .7); },
  powerOn(){ this.noise(.28, 1800, 300, .09, .6); this.beep(85,.4,'sine',.13); this.beep(7800,.5,'sine',.004,.05); },
  knob(){ this.beep(180,.03,'square',.05); this.noise(.06, 3000, 1500, .05, 2); },
  zap(){ this.noise(.22, 4000, 2500, .07, .4); },
  key(){ this.beep(2200 + Math.random()*400, .015, 'square', .012); },
  sw(){ this.beep(900,.02,'square',.05); this.noise(.04, 5000, 3000, .05, 3); },
  insert(){ this.noise(.25, 600, 200, .1, 1.5); this.beep(70,.18,'sine',.15,.05); this.noise(.9, 300, 320, .035, 4); },
  eject(){ this.beep(90,.12,'sine',.12); this.noise(.3, 300, 900, .07, 1.2); },
  setOn(v){ this.on = v; if (this.master) this.master.gain.setTargetAtTime(v ? .6 : 0, this.ctx.currentTime, .05); }
};


/* =========================================================
   ÉTAT ET ACTIONS
   ========================================================= */
const st = {mode:'boot', sel:0, cur:-1, busy:true, tune:2, dialPos:2, pview:'list', psel:0, playing:-1, playT:0, loading:false};
let clockT = 0, lightsOn = true;
const timers = [];
const after = (s, fn) => timers.push({at:clockT + s, fn});
const chan = $('chan'), hint = $('hint'), backBtn = $('backBtn'), linksEl = $('links'), termInput = $('termInput');
const sndBtn = $('sndBtn'), lightBtn = $('lightBtn'), langBtn = $('langBtn');
const PROJ = CV.sections.findIndex(s => s.projects);   // index de la section Projets

refreshToggles = () => {
  sndBtn.textContent = sfx.on ? UI.soundOn : UI.soundOff; sndBtn.setAttribute('aria-pressed', String(sfx.on));
  lightBtn.textContent = lightsOn ? UI.lightOn : UI.lightOff; lightBtn.setAttribute('aria-pressed', String(lightsOn));
};
refreshToggles();

langBtn.onclick = () => { setLang(LANG === 'fr' ? 'en' : 'fr'); };

function tuneLabel(n){
  if (n === 1) return UI.mireSub.toLowerCase();
  if (n >= 2 && n <= 7) return CV.sections[n-2].label.toLowerCase();
  if (n === 12) return 'terminal';
  return UI.noSignal.toLowerCase();
}
function hud(){
  const touch = coarse;
  let h = '';
  if (st.mode === 'menu'){
    chan.textContent = `${UI.ch} ${pad2(st.tune)} · ${tuneLabel(st.tune)}`;
    h = st.tune === 12 ? UI.hintTerm : st.tune === 1 ? UI.hintMire : st.tune > 7 ? UI.hintNoSignal : (touch ? UI.hintMenuTouch : UI.hintMenu);
  } else if (st.mode === 'section'){
    const s = CV.sections[st.cur];
    chan.textContent = `${UI.ch} ${s.ch.replace('CH ','')} · ${s.label.toLowerCase()}`;
    if (s.projects) h = st.pview === 'detail' ? (touch ? UI.hintDetailTouch : UI.hintDetail) : (touch ? UI.hintListTouch : UI.hintList);
    else h = touch ? UI.hintSectionTouch : UI.hintSection;
  } else chan.textContent = UI.chStandby;
  hint.textContent = h;
  backBtn.hidden = !(coarse && st.mode === 'section');
  document.body.classList.toggle('has-back', !backBtn.hidden);
  updateLinks();
}
function updateLinks(){
  let links = [];
  if (st.mode === 'section' && !st.busy){
    const s = CV.sections[st.cur];
    if (s.links) links = s.links;
    if (s.projects && st.pview === 'detail' && st.playing >= 0){
      const p = CV.projects[st.playing], m = PROJECT_META[st.playing];
      if (m.link && p.linkLabel) links = [{href:m.link, label:p.linkLabel}];
    }
  }
  const key = links.map(l => l.href + l.label).join('|');
  if (linksEl.dataset.key === key) return;
  linksEl.dataset.key = key;
  linksEl.innerHTML = links.map(l => `<a href="${esc(l.href)}" target="_blank" rel="noopener">${esc(l.label)}</a>`).join('');
  linksEl.hidden = !links.length;
}

function setActive(tv){ tv.statT = 0; tv.brightT = 1.55; }
function setIdle(tv){ tv.statT = .62; tv.brightT = .42; }

function start(){
  if (st.mode !== 'boot') return;
  st.mode = 'intro';
  sfx.init();
  $('boot').classList.add('off');
  setTimeout(()=>$('boot').remove(), 900);
  glCanvas.focus();
  moveCam(viewFor(tvs[0], true), 2.6*M, 0.2);
  tvs.slice(1).forEach((tv,i)=>{ after((.35 + i*.16)*M, ()=>{ tv.power = 0; tv.powerT = 1; setIdle(tv); sfx.beep(70 + i*6, .18, 'sine', .05); }); });
  after(1.7*M, ()=>{ const m = tvs[0]; m.power = 0; m.powerT = 1; setActive(m); sfx.powerOn(); });
  after(2.4*M, ()=>{ st.mode = 'menu'; st.busy = false; hud(); });
}

function openSection(i, then){
  if (st.busy || i < 0 || i >= CV.sections.length) return;
  if (st.mode === 'section' && st.cur === i){ then && then(); return; }
  const prev = st.mode === 'section' ? tvs[st.cur+1] : tvs[0];
  const tv = tvs[i+1];
  st.busy = true; st.mode = 'section'; st.cur = i; st.sel = i;
  if (st.tune >= 2 && st.tune <= 7) syncTune(i + 2);
  termInput.blur();
  setIdle(prev); prev.dirty = true;
  tv.scroll = tv.scrollT = 0; tv.hover = null;
  if (CV.sections[i].projects){ st.pview = st.playing >= 0 ? 'detail' : 'list'; }
  sfx.select(); sfx.whoosh();
  moveCam(sectionView(i), 1.15*M, .28);
  after(.5*M, ()=>{ tv.power = 0; tv.powerT = 1; setActive(tv); sfx.powerOn(); });
  after(1.15*M, ()=>{ st.busy = false; hud(); then && then(); });
  hud();
}
function goMenu(){
  if (st.busy || st.mode !== 'section') return;
  const tv = tvs[st.cur+1], m = tvs[0];
  st.busy = true; st.mode = 'menu';
  if (st.tune >= 2 && st.tune <= 7) st.sel = st.tune - 2;
  setIdle(tv); tv.hover = null; tv.dirty = true;
  sfx.back(); sfx.whoosh();
  moveCam(viewFor(m, true), 1.0*M, .25);
  after(.45*M, ()=>{ m.power = 0; m.powerT = 1; setActive(m); sfx.powerOn(); if (st.tune === 12 && !coarse) termInput.focus({preventScroll:true}); });
  after(1.0*M, ()=>{ st.busy = false; hud(); });
  hud();
}

/* ---------- sélecteur de chaîne (télé principale) ---------- */
function nearestDial(n){ const d = ((n - st.tune + 18) % 12) - 6; return st.dialPos + d; }
function syncTune(n){ st.dialPos = nearestDial(n); st.tune = n; }
function tuneTo(n, fromDial = false){
  if (st.mode !== 'menu' || st.busy) return;
  n = ((n - 1) % 12 + 12) % 12 + 1;
  if (n === st.tune) return;
  syncTune(n);
  if (n >= 2 && n <= 7) st.sel = n - 2;
  const m = tvs[0];
  m.burst = 1; sfx.knob(); sfx.zap();
  if (n === 12){ termBoot(); if (!coarse || fromDial) termInput.focus({preventScroll:true}); }
  else termInput.blur();
  hud();
}
function stepTune(delta){ tuneTo(st.tune + delta, true); }

/* ---------- cassettes et magnétoscope ---------- */
function playProject(i, fromTerm = false){
  if (i < 0 || i >= CV.projects.length || st.loading) return;
  if (st.mode !== 'section' || st.cur !== PROJ){
    if (st.mode === 'section' || st.mode === 'menu') openSection(PROJ, () => playProject(i));
    return;
  }
  if (media.playing === i && st.pview === 'detail') return;
  st.loading = true; st.psel = i;
  const tv = tvs[PROJ+1];
  const old = media.tapes.find(tp => tp.inVCR);
  if (old){
    const o = tapePath(old, false); o.durs = o.durs.map(x => x*.5);
    old.anim = {...o, seg:0, t:0, done:null}; old.inVCR = false;
    sfx.eject();
  }
  media.playing = -1; st.playing = -1; st.pview = 'list'; tv.dirty = true;
  const tp = media.tapes[i];
  sfx.select();
  after(.15, ()=>sfx.insert());
  animateTape(tp, true, () => {
    media.playing = i; st.playing = i; st.pview = 'detail'; st.playT = clockT; st.loading = false;
    tv.scroll = tv.scrollT = 0; tv.dlayout = null; tv.track = 1; tv.burst = .6; tv.dirty = true;
    sfx.beep(1200, .05, 'square', .03);
    moveCam(sectionView(PROJ), .9*M, .05);   // on s'approche de l'écran pour lire
    hud();
  });
  hud();
}
function ejectToList(){
  if (st.loading) return;
  const tv = tvs[PROJ+1];
  const tp = media.tapes.find(x => x.inVCR);
  if (tp){ animateTape(tp, false, null); sfx.eject(); }
  media.playing = -1; st.playing = -1; st.pview = 'list'; tv.burst = .7; tv.scroll = tv.scrollT = 0; tv.dirty = true;
  moveCam(sectionView(PROJ), .9*M, .05);     // on recule pour revoir les cassettes
  hud();
}

/* ---------- lumière, langue ---------- */
function toggleLights(){ lightsOn = !lightsOn; sfx.sw(); refreshToggles(); }
function setLang(l){
  if (l === LANG || !CONTENT[l]) return;
  LANG = l; CV = CONTENT[l]; UI = CV.ui;
  try { localStorage.setItem('ds-lang', l); } catch(e){}
  for (const tv of tvs){ if (tv.idx > 0){ tv.sec = CV.sections[tv.idx-1]; tv.layout = layoutSection(tv.ctx, tv.sec); } tv.dlayout = null; tv.dirty = true; }
  refreshTapeLabels();
  applyLangDOM();
  hud();
}

function scrollBy(dy){
  if (st.mode !== 'section') return;
  const tv = tvs[st.cur+1];
  const L = CV.sections[st.cur].projects ? (st.pview === 'detail' ? tv.dlayout : null) : tv.layout;
  if (!L) return;
  const max = Math.max(0, L.height - (AREA.bottom - AREA.top));
  tv.scrollT = THREE.MathUtils.clamp(tv.scrollT + dy, 0, max);
}

/* =========================================================
   CLAVIER, SOURIS, TACTILE
   ========================================================= */
const bootEl = $('boot');
bootEl.addEventListener('click', start);
addEventListener('keydown', e => { if (st.mode === 'boot' && !bootEl.hidden && !e.metaKey && !e.ctrlKey && textcv.hidden){ e.preventDefault(); start(); } }, {capture:true});

const termActive = () => st.mode === 'menu' && st.tune === 12 && !st.busy;

/* ---------- saisie du terminal (champ caché, marche aussi sur mobile) ---------- */
termInput.addEventListener('input', () => {
  if (!termActive()){ termInput.value = ''; return; }
  term.input = termInput.value.slice(0, 120); termInput.value = term.input; sfx.key();
});
termInput.addEventListener('keydown', e => {
  if (!termActive()) return;
  if (e.key === 'Enter'){ e.preventDefault(); termRun(term.input); term.input = ''; termInput.value = ''; }
  else if (e.key === 'Escape'){ e.preventDefault(); termInput.blur(); tuneTo(2); }
  else if (e.key === 'ArrowUp' || e.key === 'ArrowDown'){
    e.preventDefault(); if (!term.hist.length) return;
    term.hi = term.hi < 0 ? term.hist.length : term.hi;
    term.hi = THREE.MathUtils.clamp(term.hi + (e.key === 'ArrowUp' ? -1 : 1), 0, term.hist.length);
    term.input = term.hist[term.hi] || ''; termInput.value = term.input;
  }
  else if (e.key === 'PageUp' || e.key === 'PageDown'){ e.preventDefault(); stepTune(e.key === 'PageUp' ? 1 : -1); }
  else if (e.key === 'Tab') e.preventDefault();
});

/* ---------- clavier ---------- */
addEventListener('keydown', e => {
  if (!textcv.hidden){ if (e.key === 'Escape') $('closeTxt').click(); return; }
  const k = e.key;
  if (e.target === termInput) return;
  if ((e.target.tagName === 'BUTTON' || e.target.tagName === 'A') && (k === 'Enter' || k === ' ')) return; // le bouton garde sa touche
  if (st.mode === 'boot' || st.mode === 'intro' || st.busy || e.metaKey || e.ctrlKey || e.altKey) return;
  if (termActive()){
    // le terminal reprend la main si le champ a perdu le focus
    if (k === 'Escape'){ e.preventDefault(); tuneTo(2); }
    else if (k === 'PageUp' || k === 'PageDown'){ e.preventDefault(); stepTune(k === 'PageUp' ? 1 : -1); }
    else if (k.length === 1 || k === 'Enter' || k === 'Backspace'){
      e.preventDefault(); termInput.focus({preventScroll:true});
      if (k === 'Enter'){ termRun(term.input); term.input = ''; }
      else if (k === 'Backspace') term.input = term.input.slice(0, -1);
      else { term.input += k; sfx.key(); }
      termInput.value = term.input;
    }
    return;
  }
  if (k === 'l' || k === 'L'){ toggleLights(); return; }
  if (st.mode === 'menu'){
    if (/^[1-6]$/.test(k)){ openSection(+k-1); return; }
    if (k === 'PageUp' || k === '+' || k === 'PageDown' || k === '-'){ e.preventDefault(); stepTune(k === 'PageUp' || k === '+' ? 1 : -1); return; }
    const onGuide = st.tune >= 2 && st.tune <= 7;
    if (k==='ArrowDown' || k==='s' || k==='S'){ e.preventDefault(); if (!onGuide) return tuneTo(2); st.sel = (st.sel+1) % 6; syncTune(st.sel + 2); sfx.tick(); hud(); }
    else if (k==='ArrowUp' || k==='z' || k==='w' || k==='Z' || k==='W'){ e.preventDefault(); if (!onGuide) return tuneTo(7); st.sel = (st.sel+5) % 6; syncTune(st.sel + 2); sfx.tick(); hud(); }
    else if (k==='Enter' || k===' ' || k==='ArrowRight'){ e.preventDefault(); if (onGuide) openSection(st.sel); else tuneTo(2); }
    return;
  }
  if (st.mode === 'section'){
    const proj = CV.sections[st.cur].projects;
    if (proj && st.pview === 'list'){
      if (k==='ArrowDown'){ e.preventDefault(); st.psel = (st.psel+1) % CV.projects.length; sfx.tick(); }
      else if (k==='ArrowUp'){ e.preventDefault(); st.psel = (st.psel+CV.projects.length-1) % CV.projects.length; sfx.tick(); }
      else if (k==='Enter' || k===' ' || k==='ArrowRight'){ e.preventDefault(); playProject(st.psel); }
      else if (/^[1-6]$/.test(k)) playProject(+k-1);
      else if (k==='Escape' || k==='Backspace' || k==='ArrowLeft'){ e.preventDefault(); goMenu(); }
      return;
    }
    if (k==='Escape' || k==='Backspace' || k==='ArrowLeft'){ e.preventDefault(); proj ? ejectToList() : goMenu(); }
    else if (k==='ArrowDown'){ e.preventDefault(); scrollBy(70); }
    else if (k==='ArrowUp'){ e.preventDefault(); scrollBy(-70); }
    else if (k==='PageDown' || k===' '){ e.preventDefault(); scrollBy(360); }
    else if (k==='PageUp'){ e.preventDefault(); scrollBy(-360); }
  }
});

/* ---------- pointeur : on lance un rayon dans toute la scène ---------- */
const ray = new THREE.Raycaster(), ndc = new THREE.Vector2(), mouse = {x:0, y:0, sx:0, sy:0};
bulb.userData.lamp = true; shade.userData.lamp = true;
function pick(cx, cy){
  ndc.set(cx/innerWidth*2-1, -(cy/innerHeight)*2+1);
  ray.setFromCamera(ndc, camera);
  for (const hit of ray.intersectObject(scene, true)){
    const ud = hit.object.userData;
    if (ud.skip || hit.object.isPoints || hit.object.isLight) continue;
    if (ud.tv){
      const tv = ud.tv; const [u,v] = barrel(hit.uv.x, hit.uv.y);
      const px = (u*CW - CW/2)/SAFE + CW/2, py = ((1-v)*CH - CH/2)/SAFE + CH/2;
      return {kind:'screen', tv, h: tv.hits.find(r => px>=r.x && px<=r.x+r.w && py>=r.y && py<=r.y+r.h)};
    }
    if (ud.dialOf) return {kind:'dial', tv:ud.dialOf, point:hit.point};
    if (ud.tape != null) return {kind:'tape', i:ud.tape};
    if (ud.lamp) return {kind:'lamp'};
    return null; // un objet opaque bloque le rayon
  }
  return null;
}
function activeTV(){ return st.mode === 'menu' ? tvs[0] : st.mode === 'section' ? tvs[st.cur+1] : null; }
const ready = () => (st.mode === 'menu' || st.mode === 'section') && !st.busy;
let drag = null, hoverTape = -1;

function dialScreenAngle(e){
  const p = tvs[0].dial.getWorldPosition(new THREE.Vector3()).project(camera);
  const sx = (p.x*.5+.5)*innerWidth, sy = (-p.y*.5+.5)*innerHeight;
  return Math.atan2(e.clientY - sy, e.clientX - sx);
}
glCanvas.addEventListener('pointermove', e => {
  mouse.x = e.clientX/innerWidth*2-1; mouse.y = -(e.clientY/innerHeight)*2+1;
  if (drag && drag.dial){
    let a = dialScreenAngle(e), d = a - drag.a; if (d > Math.PI) d -= Math.PI*2; if (d < -Math.PI) d += Math.PI*2;
    drag.acc += d; drag.a = a;
    while (drag.acc > Math.PI/6){ drag.acc -= Math.PI/6; drag.moved = true; stepTune(1); }
    while (drag.acc < -Math.PI/6){ drag.acc += Math.PI/6; drag.moved = true; stepTune(-1); }
    return;
  }
  if (drag){ const dy = e.clientY - drag.y; if (Math.abs(e.clientY - drag.y0) > 6) drag.moved = true; drag.y = e.clientY; if (st.mode === 'section' && drag.moved) scrollBy(-dy*1.6); return; }
  if (!ready()){ glCanvas.style.cursor = 'default'; return; }
  const p = pick(e.clientX, e.clientY), act = activeTV();
  let pointer = false, hov = null, ht = -1;
  if (p){
    if (p.kind === 'screen'){
      if (p.tv === act && p.h){ pointer = true; hov = p.h.act;
        if (p.h.act === 'open' && st.sel !== p.h.i && st.tune >= 2 && st.tune <= 7){ st.sel = p.h.i; syncTune(st.sel + 2); sfx.tick(); hud(); }
        if (p.h.act === 'proj' && st.psel !== p.h.i){ st.psel = p.h.i; sfx.tick(); }
        if (p.h.act === 'term') pointer = false;
      } else if (p.tv !== act) pointer = true;
    } else if (p.kind === 'dial') pointer = p.tv.idx === 0 && st.mode === 'menu';
    else if (p.kind === 'tape'){ pointer = true; ht = p.i; }
    else if (p.kind === 'lamp') pointer = true;
  }
  if (act){ const nh = (p && p.tv === act) ? hov : null; if (nh !== act.hover){ if (nh === 'back' || nh === 'list') sfx.tick(); act.hover = nh; } }
  if (ht !== hoverTape){ if (ht >= 0) sfx.tick(); hoverTape = ht; }
  glCanvas.style.cursor = pointer ? 'pointer' : 'default';
});
glCanvas.addEventListener('pointerdown', e => {
  glCanvas.setPointerCapture?.(e.pointerId);
  const p = ready() ? pick(e.clientX, e.clientY) : null;
  if (p && p.kind === 'dial' && p.tv.idx === 0 && st.mode === 'menu'){ drag = {dial:true, a:dialScreenAngle(e), acc:0, moved:false}; return; }
  drag = {y:e.clientY, y0:e.clientY, moved:false};
});
glCanvas.addEventListener('pointerup', e => {
  const d = drag; drag = null;
  if (d && d.dial){ if (!d.moved) stepTune(1); return; }
  if ((d && d.moved) || !ready()) return;
  const p = pick(e.clientX, e.clientY); if (!p) return;
  if (p.kind === 'lamp') return toggleLights();
  if (p.kind === 'tape') return playProject(p.i);
  if (p.kind === 'dial') return;
  const act = activeTV();
  if (p.tv === act){
    const h = p.h; if (!h) return;
    if (h.act === 'open') openSection(h.i);
    else if (h.act === 'back') goMenu();
    else if (h.act === 'proj') playProject(h.i);
    else if (h.act === 'list') ejectToList();
    else if (h.act === 'term') termInput.focus({preventScroll:true});
  } else {
    if (p.tv.idx === 0) goMenu(); else openSection(p.tv.idx - 1);
  }
});
glCanvas.addEventListener('pointercancel', () => { drag = null; });
glCanvas.addEventListener('wheel', e => {
  if (st.mode === 'section'){ e.preventDefault(); scrollBy(e.deltaY * (e.deltaMode ? 40 : 1)); return; }
  if (st.mode === 'menu' && ready()){
    const p = pick(e.clientX, e.clientY);
    if (p && p.kind === 'dial'){ e.preventDefault(); const now = performance.now(); if (now - (glCanvas._wt || 0) > 140){ glCanvas._wt = now; stepTune(e.deltaY > 0 ? 1 : -1); } }
  }
}, {passive:false});
backBtn.onclick = () => { if (st.mode === 'section' && CV.sections[st.cur].projects && st.pview === 'detail') ejectToList(); else goMenu(); };

/* =========================================================
   BOUCLE DE RENDU

function drawMain(tv, t){
  const n = st.tune;

  else if (n >= 2 && n <= 7) drawMenu(tv, t);
  else if (n === 12){ termBoot(); drawTerminal(tv, t); }
  else drawNoSignal(tv, t, n);
}
onImageReady = () => { for (const tv of tvs) tv.dirty = true; };

}
addEventListener('resize', resize);

setProgress(.8);
try { await Promise.race([Promise.all([document.fonts.load('58px VT323'), document.fonts.load('600 26px "IBM Plex Mono"')]), new Promise(r=>setTimeout(r, 2500))]); } catch(e){}
for (const tv of tvs){ if (tv.sec) tv.layout = layoutSection(tv.ctx, tv.sec); }
refreshTapeLabels();   // une fois les polices chargées
for (const tv of tvs){ if (tv.idx === 0) drawMain(tv, 0); else drawSection(tv, 0, false); }
for (const tv of tvs) tv.tex.needsUpdate = true;
setProgress(.95);

const clock = new THREE.Clock();
const tmpP = new V(), backDir = new V(), camR = new V(), camU = new V();
const L = {bulb:8, hemi:.8, spot:4, tv:1};   // niveaux lumineux courants
function frame(){
  const dt = Math.min(clock.getDelta(), .05); clockT += dt; const t = clockT;
  for (let i=timers.length-1;i>=0;i--) if (clockT >= timers[i].at){ const f = timers[i].fn; timers.splice(i,1); f(); }

  // caméra
  if (tween && tween.t < 1){
    tween.t = Math.min(1, tween.t + dt/tween.dur); const k = ease(tween.t);
    camPos.lerpVectors(tween.fp, tween.tp, k); camTgt.lerpVectors(tween.ft, tween.tt, k);
    backDir.subVectors(tween.fp, tween.ft).add(tmpP.subVectors(tween.tp, tween.tt)).normalize();
    const arc = Math.sin(Math.PI*k) * tween.lift;
    tmpP.copy(camPos).addScaledVector(backDir, arc); tmpP.y += arc*.35;
  } else tmpP.copy(camPos);
  mouse.sx += (mouse.x - mouse.sx) * Math.min(1, dt*3); mouse.sy += (mouse.y - mouse.sy) * Math.min(1, dt*3);
  camera.position.copy(tmpP); camera.lookAt(camTgt);
  camR.setFromMatrixColumn(camera.matrixWorld, 0); camU.setFromMatrixColumn(camera.matrixWorld, 1);
  if (!reduce) camera.position.addScaledVector(camR, mouse.sx*.05 + Math.sin(t*.37)*.008).addScaledVector(camU, mouse.sy*.035 + Math.sin(t*.6)*.006);
  camera.lookAt(camTgt);

  // lumière de la pièce
  const kL = Math.min(1, dt*4);
  L.bulb += ((lightsOn ? 8 : 0) - L.bulb)*kL; L.hemi += ((lightsOn ? .8 : .1) - L.hemi)*kL;
  L.spot += ((lightsOn ? 4 : 0) - L.spot)*kL; L.tv += ((lightsOn ? 1 : 1.5) - L.tv)*kL;
  bulbLight.intensity = L.bulb * (st.mode === 'boot' ? .55 : .8) * (0.97 + Math.sin(t*31)*.03);
  bulb.material.emissiveIntensity = 3 * (L.bulb/8) + .05;
  hemi.intensity = L.hemi;
  lamp.spot.intensity = L.spot; lamp.bulbM.emissiveIntensity = 2.5 * L.spot/4 + .03;
  bloom.strength = .62 + (L.tv - 1) * .36;

  // télés
  const act = activeTV();
  for (const tv of tvs){
    if (tv.powerT > tv.power) tv.power = Math.min(tv.powerT, tv.power + dt/(.42*M));
    tv.stat += (tv.statT - tv.stat) * Math.min(1, dt*5);
    tv.bright += (tv.brightT - tv.bright) * Math.min(1, dt*5);
    tv.burst = Math.max(0, tv.burst - dt*3.2); tv.track = Math.max(0, tv.track - dt*.75);
    const u = tv.mat.uniforms; u.uTime.value = t; u.uStatic.value = Math.min(1, Math.max(tv.stat, tv.burst*.9)); u.uPower.value = tv.power; u.uBright.value = tv.bright; u.uTrack.value = tv.track;
    tv.light.intensity = L.tv * tv.power * (0.3 + tv.bright*1.25) * (0.92 + Math.sin(t*23 + tv.idx)*.08);
    if (tv.rack.userData.led) tv.rack.userData.led.material.emissiveIntensity = (Math.sin(t*2 + tv.idx*1.7) > .2 ? 2.2 : .15) * tv.power;
    tv.led.material.emissiveIntensity = tv.power * (tv === act ? 4 : 1.3);
    if (tv.dial){
      const target = -(tv.idx === 0 ? st.dialPos : tv.dialA/(Math.PI/6)) * Math.PI/6;
      tv.dial.rotation.z += (target - tv.dial.rotation.z) * Math.min(1, dt*12);
    }
    if (tv.sec || tv.idx === 0){ const ds = tv.scrollT - tv.scroll; if (Math.abs(ds) > .3){ tv.scroll += ds * Math.min(1, dt*10); tv.dirty = true; } }
    const isAct = tv === act;
    if (tv.idx === 0){ if (isAct || tv.dirty){ drawMain(tv, t); tv.tex.needsUpdate = true; tv.dirty = false; } }
    else if (tv.layout && (isAct || tv.dirty)){ drawSection(tv, t, isAct); tv.tex.needsUpdate = true; tv.dirty = false; }
  }

  // cassettes, magnétoscope
  updateTapes(dt);
  for (const tp of media.tapes){
    if (tp.anim || tp.inVCR) continue;
    const want = tp.home.z + (tp.i === hoverTape ? .045 : 0);
    tp.group.position.z += (want - tp.group.position.z) * Math.min(1, dt*10);
  }
  media.vled.material.emissiveIntensity = media.playing >= 0 ? 3 : (st.loading ? (Math.floor(t*6)%2 ? 3 : 0) : 0);
  drawVCRDisplay(t);
  if (Math.floor(t*4) !== Math.floor((t-dt)*4)) updateLinks();

  // ambiance
  bulbGroup.rotation.z = Math.sin(t*.7)*.035; bulbGroup.rotation.x = Math.sin(t*.53)*.025;
  const pa = dustGeo.attributes.position.array;
  for (let i=0;i<dustN;i++){ pa[i*3+1] += Math.sin(t*.3 + i)*.0006 - .0004; pa[i*3] += Math.cos(t*.2 + i*1.3)*.0005; if (pa[i*3+1] < 0) pa[i*3+1] = 3.4; }
  dustGeo.attributes.position.needsUpdate = true;

  composer.render();
  requestAnimationFrame(frame);
}
camera.position.copy(camPos); camera.lookAt(camTgt);
resize();
requestAnimationFrame(frame);
hideLoader();

</script>
